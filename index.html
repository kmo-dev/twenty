<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎅 Weihnachtsmann Shooter - Türchen 20 🎄</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #1a1a2e 0%, #0f4c75 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: white;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            cursor: crosshair;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        #health {
            position: absolute;
            top: 60px;
            left: 20px;
            font-size: 20px;
            z-index: 10;
        }

        .heart {
            display: inline-block;
            color: #ff0000;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        #jumpButton {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.3);
            border: 4px solid white;
            border-radius: 50%;
            font-size: 32px;
            color: white;
            cursor: pointer;
            display: none;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            user-select: none;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        #jumpButton:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 20;
        }

        #gameOver h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff6b6b;
        }

        #gameOver p {
            font-size: 24px;
            margin-bottom: 30px;
        }

        #restartButton {
            background: #4ecdc4;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        #restartButton:hover {
            background: #45b7af;
            transform: scale(1.05);
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            max-width: 250px;
            z-index: 10;
        }

        #instructions h3 {
            margin-bottom: 10px;
            color: #4ecdc4;
        }

        @media (max-width: 768px) {
            #jumpButton {
                display: flex !important;
            }

            canvas {
                cursor: default;
            }

            #instructions {
                display: none;
            }
        }

        .title {
            text-align: center;
            margin-bottom: 20px;
        }

        .title h1 {
            font-size: 36px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
        }

        .title p {
            font-size: 18px;
            color: #4ecdc4;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="title">
        <h1>🎅 Weihnachtsmann Shooter 🎄</h1>
        <p>Türchen 20 - pep.digital Adventskalender</p>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <div id="ui">
            Score: <span id="score">0</span>
        </div>

        <div id="health"></div>

        <div id="jumpButton">⬆</div>

        <div id="instructions">
            <h3>Steuerung:</h3>
            <p>🖱️ Maus: Zielen</p>
            <p>🖱️ Klick: Schießen</p>
            <p>⌨️ Leertaste: Springen</p>
            <p><br>Zerstöre die Schneemänner!</p>
        </div>

        <div id="gameOver">
            <h1>Game Over! 🎄</h1>
            <p>Dein Score: <span id="finalScore">0</span></p>
            <button id="restartButton">Nochmal spielen</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Canvas Größe
        function resizeCanvas() {
            const maxWidth = Math.min(window.innerWidth - 40, 1200);
            const maxHeight = Math.min(window.innerHeight - 200, 600);
            canvas.width = maxWidth;
            canvas.height = maxHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Spiel Variablen
        let gameRunning = true;
        let score = 0;
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // Weihnachtsmann
        const santa = {
            x: 100,
            y: canvas.height - 150,
            width: 50,
            height: 70,
            velocityY: 0,
            gravity: 0.8,
            jumpPower: -15,
            isJumping: false,
            health: 3,
            maxHealth: 3
        };

        // Arrays für Spielobjekte
        const snowballs = [];
        const snowmen = [];
        const particles = [];

        // Spawn Timer
        let snowmanSpawnTimer = 0;
        let snowmanSpawnInterval = 120; // Frames
        let shootCooldown = 0;

        // Hintergrund Elemente
        const backgroundTrees = [];
        for (let i = 0; i < 10; i++) {
            backgroundTrees.push({
                x: i * 150 + Math.random() * 50,
                y: canvas.height - 100 - Math.random() * 50,
                size: 30 + Math.random() * 20
            });
        }

        // Zeichne Weihnachtsmann
        function drawSanta() {
            ctx.save();

            // Körper (rot)
            ctx.fillStyle = '#c41e3a';
            ctx.fillRect(santa.x, santa.y + 20, santa.width, santa.height - 20);

            // Gürtel (schwarz)
            ctx.fillStyle = '#000000';
            ctx.fillRect(santa.x, santa.y + 50, santa.width, 8);

            // Gürtelschnalle (gold)
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(santa.x + 17, santa.y + 48, 16, 12);

            // Kopf (hautfarben)
            ctx.fillStyle = '#ffdbac';
            ctx.beginPath();
            ctx.arc(santa.x + santa.width / 2, santa.y + 10, 18, 0, Math.PI * 2);
            ctx.fill();

            // Mütze (rot)
            ctx.fillStyle = '#c41e3a';
            ctx.beginPath();
            ctx.moveTo(santa.x + 7, santa.y + 10);
            ctx.lineTo(santa.x + santa.width - 7, santa.y + 10);
            ctx.lineTo(santa.x + santa.width - 7, santa.y - 5);
            ctx.lineTo(santa.x + 7, santa.y - 5);
            ctx.closePath();
            ctx.fill();

            // Mützen Bommel (weiß)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(santa.x + santa.width / 2, santa.y - 10, 6, 0, Math.PI * 2);
            ctx.fill();

            // Bart (weiß)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(santa.x + santa.width / 2, santa.y + 20, 12, 0, Math.PI * 2);
            ctx.fill();

            // Waffe (Schneekanone)
            const angle = Math.atan2(mouseY - (santa.y + 30), mouseX - (santa.x + santa.width));
            ctx.translate(santa.x + santa.width, santa.y + 30);
            ctx.rotate(angle);

            // Kanone
            ctx.fillStyle = '#4a5568';
            ctx.fillRect(0, -5, 40, 10);
            ctx.fillStyle = '#2d3748';
            ctx.fillRect(35, -8, 10, 16);

            ctx.restore();
        }

        // Zeichne Schneemann
        function drawSnowman(snowman) {
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;

            // Unterer Kreis
            ctx.beginPath();
            ctx.arc(snowman.x, snowman.y + 20, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Mittlerer Kreis
            ctx.beginPath();
            ctx.arc(snowman.x, snowman.y, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Kopf
            ctx.beginPath();
            ctx.arc(snowman.x, snowman.y - 15, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Augen
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(snowman.x - 4, snowman.y - 17, 2, 0, Math.PI * 2);
            ctx.arc(snowman.x + 4, snowman.y - 17, 2, 0, Math.PI * 2);
            ctx.fill();

            // Nase (Karotte)
            ctx.fillStyle = '#ff6b35';
            ctx.beginPath();
            ctx.moveTo(snowman.x, snowman.y - 13);
            ctx.lineTo(snowman.x + 10, snowman.y - 13);
            ctx.lineTo(snowman.x, snowman.y - 11);
            ctx.closePath();
            ctx.fill();

            // Knöpfe
            ctx.fillStyle = '#000000';
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.arc(snowman.x, snowman.y - 5 + i * 7, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Zeichne Schneekugel
        function drawSnowball(snowball) {
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(snowball.x, snowball.y, snowball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Glitzer Effekt
            ctx.fillStyle = 'rgba(173, 216, 230, 0.5)';
            ctx.beginPath();
            ctx.arc(snowball.x - 2, snowball.y - 2, snowball.radius / 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // Zeichne Baum
        function drawTree(tree) {
            ctx.fillStyle = '#228b22';
            ctx.beginPath();
            ctx.moveTo(tree.x, tree.y);
            ctx.lineTo(tree.x - tree.size / 2, tree.y + tree.size);
            ctx.lineTo(tree.x + tree.size / 2, tree.y + tree.size);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#654321';
            ctx.fillRect(tree.x - 5, tree.y + tree.size, 10, 20);
        }

        // Erstelle Partikel
        function createParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 60,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        // Schieße Schneekugel
        function shootSnowball() {
            if (shootCooldown > 0 || !gameRunning) return;

            const angle = Math.atan2(mouseY - (santa.y + 30), mouseX - (santa.x + santa.width));
            const speed = 12;

            snowballs.push({
                x: santa.x + santa.width + 40 * Math.cos(angle),
                y: santa.y + 30 + 40 * Math.sin(angle),
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: 8
            });

            shootCooldown = 15; // Cooldown frames
        }

        // Spawne Schneemann
        function spawnSnowman() {
            snowmen.push({
                x: canvas.width + 50,
                y: canvas.height - 150,
                width: 40,
                height: 50,
                speed: 2 + Math.random() * 1.5,
                health: 1
            });
        }

        // Update Spiel
        function update() {
            if (!gameRunning) return;

            // Update Cooldowns
            if (shootCooldown > 0) shootCooldown--;

            // Update Santa
            santa.velocityY += santa.gravity;
            santa.y += santa.velocityY;

            // Boden Kollision
            const ground = canvas.height - 150;
            if (santa.y >= ground) {
                santa.y = ground;
                santa.velocityY = 0;
                santa.isJumping = false;
            }

            // Update Schneekugeln
            for (let i = snowballs.length - 1; i >= 0; i--) {
                const ball = snowballs[i];
                ball.x += ball.vx;
                ball.y += ball.vy;

                // Entferne wenn außerhalb
                if (ball.x > canvas.width + 50 || ball.x < -50 || ball.y > canvas.height + 50 || ball.y < -50) {
                    snowballs.splice(i, 1);
                }
            }

            // Update Schneemänner
            for (let i = snowmen.length - 1; i >= 0; i--) {
                const snowman = snowmen[i];
                snowman.x -= snowman.speed;

                // Entferne wenn zu weit links
                if (snowman.x < -100) {
                    snowmen.splice(i, 1);
                    continue;
                }

                // Kollision mit Santa
                if (snowman.x < santa.x + santa.width &&
                    snowman.x + snowman.width > santa.x &&
                    snowman.y < santa.y + santa.height &&
                    snowman.y + snowman.height > santa.y) {
                    santa.health--;
                    createParticles(snowman.x, snowman.y, '#ff0000', 15);
                    snowmen.splice(i, 1);

                    if (santa.health <= 0) {
                        gameOver();
                    }
                    continue;
                }

                // Kollision mit Schneekugeln
                for (let j = snowballs.length - 1; j >= 0; j--) {
                    const ball = snowballs[j];
                    const dx = ball.x - snowman.x;
                    const dy = ball.y - snowman.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < ball.radius + 25) {
                        createParticles(snowman.x, snowman.y, '#ffffff', 20);
                        snowmen.splice(i, 1);
                        snowballs.splice(j, 1);
                        score += 10;
                        document.getElementById('score').textContent = score;
                        break;
                    }
                }
            }

            // Update Partikel
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Spawne Schneemänner
            snowmanSpawnTimer++;
            if (snowmanSpawnTimer >= snowmanSpawnInterval) {
                spawnSnowman();
                snowmanSpawnTimer = 0;
                // Erhöhe Schwierigkeit
                if (snowmanSpawnInterval > 60) {
                    snowmanSpawnInterval -= 1;
                }
            }
        }

        // Zeichne alles
        function draw() {
            // Himmel (Gradient bereits im CSS)
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Bäume im Hintergrund
            backgroundTrees.forEach(tree => {
                tree.x -= 0.5;
                if (tree.x < -50) {
                    tree.x = canvas.width + 50;
                }
                drawTree(tree);
            });

            // Boden
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);

            // Schneeflocken als Details
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            for (let i = 0; i < 50; i++) {
                const x = (i * 50 + Date.now() / 20) % canvas.width;
                const y = (i * 37) % (canvas.height - 100);
                ctx.beginPath();
                ctx.arc(x, y, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Partikel
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 60;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            // Schneemänner
            snowmen.forEach(drawSnowman);

            // Schneekugeln
            snowballs.forEach(drawSnowball);

            // Santa
            drawSanta();

            // Ziellinie
            if (!isMobile) {
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(santa.x + santa.width, santa.y + 30);
                ctx.lineTo(mouseX, mouseY);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        // Game Loop
        function gameLoop() {
            update();
            draw();
            updateHealth();
            requestAnimationFrame(gameLoop);
        }

        // Update Health Display
        function updateHealth() {
            const healthDiv = document.getElementById('health');
            healthDiv.innerHTML = '';
            for (let i = 0; i < santa.maxHealth; i++) {
                const heart = document.createElement('span');
                heart.className = 'heart';
                heart.textContent = i < santa.health ? '❤️' : '🖤';
                healthDiv.appendChild(heart);
            }
        }

        // Game Over
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        // Restart Game
        function restartGame() {
            gameRunning = true;
            score = 0;
            santa.health = santa.maxHealth;
            santa.y = canvas.height - 150;
            santa.velocityY = 0;
            snowballs.length = 0;
            snowmen.length = 0;
            particles.length = 0;
            snowmanSpawnTimer = 0;
            snowmanSpawnInterval = 120;
            document.getElementById('score').textContent = score;
            document.getElementById('gameOver').style.display = 'none';
        }

        // Event Listeners
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        canvas.addEventListener('click', () => {
            if (gameRunning) {
                shootSnowball();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !santa.isJumping && gameRunning) {
                e.preventDefault();
                santa.velocityY = santa.jumpPower;
                santa.isJumping = true;
            }
        });

        // Mobile Controls
        const jumpButton = document.getElementById('jumpButton');
        jumpButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!santa.isJumping && gameRunning) {
                santa.velocityY = santa.jumpPower;
                santa.isJumping = true;
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            mouseX = touch.clientX - rect.left;
            mouseY = touch.clientY - rect.top;

            if (gameRunning) {
                shootSnowball();
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            mouseX = touch.clientX - rect.left;
            mouseY = touch.clientY - rect.top;
        });

        document.getElementById('restartButton').addEventListener('click', restartGame);

        // Auto-shoot für Desktop (alle 20 Frames)
        setInterval(() => {
            if (gameRunning && !isMobile) {
                shootSnowball();
            }
        }, 333); // ~3 Schüsse pro Sekunde

        // Start Game
        gameLoop();
    </script>
</body>
</html>
