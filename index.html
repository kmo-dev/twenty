<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎅 Weihnachtsmann Shooter 3D - Türchen 20 🎄</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #1a1a2e 0%, #0f4c75 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: white;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        #health {
            position: absolute;
            top: 60px;
            left: 20px;
            font-size: 20px;
            z-index: 10;
        }

        .heart {
            display: inline-block;
            color: #ff0000;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        #jumpButton {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.3);
            border: 4px solid white;
            border-radius: 50%;
            font-size: 32px;
            color: white;
            cursor: pointer;
            display: none;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            user-select: none;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        #jumpButton:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 20;
        }

        #gameOver h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff6b6b;
        }

        #gameOver p {
            font-size: 24px;
            margin-bottom: 30px;
        }

        #restartButton {
            background: #4ecdc4;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        #restartButton:hover {
            background: #45b7af;
            transform: scale(1.05);
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            max-width: 250px;
            z-index: 10;
            transition: opacity 0.5s;
        }

        #instructions.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #instructions h3 {
            margin-bottom: 10px;
            color: #4ecdc4;
        }

        @media (max-width: 768px) {
            #jumpButton {
                display: flex !important;
            }

            canvas {
                cursor: default;
            }
        }

        .title {
            text-align: center;
            margin-bottom: 20px;
        }

        .title h1 {
            font-size: 36px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
        }

        .title p {
            font-size: 18px;
            color: #4ecdc4;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="title">
        <h1>🎅 Weihnachtsmann Shooter 3D 🎄</h1>
        <p>Türchen 20 - pep.digital Adventskalender</p>
    </div>

    <div id="gameContainer">
        <div id="ui">
            Score: <span id="score">0</span>
        </div>

        <div id="health"></div>

        <div id="jumpButton">⬆</div>

        <div id="instructions">
            <h3>Steuerung:</h3>
            <p>🖱️ Maus: Zielen</p>
            <p>🖱️ Klick: Schießen</p>
            <p>⌨️ Leertaste: Springen</p>
            <p><br>Zerstöre die Schneemänner!</p>
        </div>

        <div id="gameOver">
            <h1>Game Over! 🎄</h1>
            <p>Dein Score: <span id="finalScore">0</span></p>
            <button id="restartButton">Nochmal spielen</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Spiel Variablen
        let gameRunning = true;
        let score = 0;
        let mouseX = 0;
        let mouseY = 0;
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // Three.js Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 20); // Sidescroller perspective from front
        camera.lookAt(0, 3, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        const maxWidth = Math.min(window.innerWidth - 40, 1200);
        const maxHeight = Math.min(window.innerHeight - 200, 600);
        renderer.setSize(maxWidth, maxHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('gameContainer').appendChild(renderer.domElement);

        // Beleuchtung
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 20, 25);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.left = -30;
        directionalLight.shadow.camera.right = 30;
        directionalLight.shadow.camera.top = 30;
        directionalLight.shadow.camera.bottom = -30;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        // Boden
        const groundGeometry = new THREE.PlaneGeometry(100, 50);
        const groundMaterial = new THREE.MeshLambertMaterial({ color: 0xffffff });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 0;
        ground.receiveShadow = true;
        scene.add(ground);

        // Weihnachtsmann erstellen
        function createSanta() {
            const santa = new THREE.Group();

            // Körper (rot)
            const bodyGeometry = new THREE.BoxGeometry(1, 1.5, 0.8);
            const bodyMaterial = new THREE.MeshLambertMaterial({ color: 0xc41e3a });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.75;
            body.castShadow = true;
            santa.add(body);

            // Gürtel (schwarz)
            const beltGeometry = new THREE.BoxGeometry(1.05, 0.2, 0.85);
            const beltMaterial = new THREE.MeshLambertMaterial({ color: 0x000000 });
            const belt = new THREE.Mesh(beltGeometry, beltMaterial);
            belt.position.y = 0.5;
            santa.add(belt);

            // Gürtelschnalle (gold)
            const buckleGeometry = new THREE.BoxGeometry(0.3, 0.25, 0.9);
            const buckleMaterial = new THREE.MeshLambertMaterial({ color: 0xffd700 });
            const buckle = new THREE.Mesh(buckleGeometry, buckleMaterial);
            buckle.position.set(0.4, 0.5, 0);
            santa.add(buckle);

            // Kopf (hautfarben)
            const headGeometry = new THREE.SphereGeometry(0.4, 16, 16);
            const headMaterial = new THREE.MeshLambertMaterial({ color: 0xffdbac });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 1.8;
            head.castShadow = true;
            santa.add(head);

            // Mütze (rot)
            const hatGeometry = new THREE.ConeGeometry(0.45, 0.8, 16);
            const hatMaterial = new THREE.MeshLambertMaterial({ color: 0xc41e3a });
            const hat = new THREE.Mesh(hatGeometry, hatMaterial);
            hat.position.set(0, 2.4, 0);
            hat.rotation.x = 0.2;
            hat.castShadow = true;
            santa.add(hat);

            // Mützen Bommel (weiß)
            const pomGeometry = new THREE.SphereGeometry(0.15, 8, 8);
            const pomMaterial = new THREE.MeshLambertMaterial({ color: 0xffffff });
            const pom = new THREE.Mesh(pomGeometry, pomMaterial);
            pom.position.set(0, 2.75, 0);
            santa.add(pom);

            // Bart (weiß)
            const beardGeometry = new THREE.SphereGeometry(0.3, 8, 8);
            const beardMaterial = new THREE.MeshLambertMaterial({ color: 0xffffff });
            const beard = new THREE.Mesh(beardGeometry, beardMaterial);
            beard.position.set(0.3, 1.6, 0);
            beard.scale.set(1, 1.2, 0.8);
            santa.add(beard);

            // Waffe (Schneekanone)
            const gunGeometry = new THREE.CylinderGeometry(0.15, 0.15, 1.5, 8);
            const gunMaterial = new THREE.MeshLambertMaterial({ color: 0x4a5568 });
            const gun = new THREE.Mesh(gunGeometry, gunMaterial);
            gun.rotation.z = Math.PI / 2;
            gun.position.set(0.8, 1.2, 0);
            gun.castShadow = true;
            santa.add(gun);

            santa.position.set(-10, 1.5, 0);
            santa.rotation.y = Math.PI / 2; // Rotate to face right
            santa.userData = {
                velocityY: 0,
                isJumping: false,
                health: 3,
                maxHealth: 3,
                gun: gun
            };

            return santa;
        }

        // Schneemann erstellen
        function createSnowman() {
            const snowman = new THREE.Group();

            // Unterer Körper
            const bottomGeometry = new THREE.SphereGeometry(0.6, 16, 16);
            const snowMaterial = new THREE.MeshLambertMaterial({ color: 0xffffff });
            const bottom = new THREE.Mesh(bottomGeometry, snowMaterial);
            bottom.position.y = 0.6;
            bottom.castShadow = true;
            snowman.add(bottom);

            // Mittlerer Körper
            const middleGeometry = new THREE.SphereGeometry(0.45, 16, 16);
            const middle = new THREE.Mesh(middleGeometry, snowMaterial);
            middle.position.y = 1.3;
            middle.castShadow = true;
            snowman.add(middle);

            // Kopf
            const headGeometry = new THREE.SphereGeometry(0.3, 16, 16);
            const head = new THREE.Mesh(headGeometry, snowMaterial);
            head.position.y = 1.85;
            head.castShadow = true;
            snowman.add(head);

            // Augen
            const eyeGeometry = new THREE.SphereGeometry(0.05, 8, 8);
            const eyeMaterial = new THREE.MeshLambertMaterial({ color: 0x000000 });
            const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            leftEye.position.set(-0.1, 1.9, 0.25);
            snowman.add(leftEye);
            const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            rightEye.position.set(0.1, 1.9, 0.25);
            snowman.add(rightEye);

            // Nase (Karotte)
            const noseGeometry = new THREE.ConeGeometry(0.08, 0.4, 8);
            const noseMaterial = new THREE.MeshLambertMaterial({ color: 0xff6b35 });
            const nose = new THREE.Mesh(noseGeometry, noseMaterial);
            nose.rotation.x = Math.PI / 2;
            nose.position.set(0, 1.85, 0.35);
            snowman.add(nose);

            // Knöpfe
            const buttonGeometry = new THREE.SphereGeometry(0.06, 8, 8);
            const buttonMaterial = new THREE.MeshLambertMaterial({ color: 0x000000 });
            for (let i = 0; i < 3; i++) {
                const button = new THREE.Mesh(buttonGeometry, buttonMaterial);
                button.position.set(0, 1.1 + i * 0.15, 0.42);
                snowman.add(button);
            }

            snowman.position.set(15, 1, 0);
            snowman.rotation.y = -Math.PI / 2; // Rotate to face left
            snowman.userData = {
                speed: 0.1 + Math.random() * 0.05,
                health: 1,
                jumpPhase: Math.random() * Math.PI * 2, // Random start phase for jumping
                baseY: 1
            };

            return snowman;
        }

        // Schneekugel erstellen
        function createSnowball(startPos, direction) {
            const geometry = new THREE.SphereGeometry(0.2, 16, 16);
            const material = new THREE.MeshLambertMaterial({ color: 0xffffff });
            const snowball = new THREE.Mesh(geometry, material);
            snowball.position.copy(startPos);
            snowball.castShadow = true;

            snowball.userData = {
                velocity: direction.multiplyScalar(0.5)
            };

            return snowball;
        }

        // Baum erstellen
        function createTree(x, z) {
            const tree = new THREE.Group();

            // Stamm
            const trunkGeometry = new THREE.CylinderGeometry(0.2, 0.3, 2, 8);
            const trunkMaterial = new THREE.MeshLambertMaterial({ color: 0x654321 });
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.y = 1;
            trunk.castShadow = true;
            tree.add(trunk);

            // Krone (3 Kegel)
            const crownMaterial = new THREE.MeshLambertMaterial({ color: 0x228b22 });
            for (let i = 0; i < 3; i++) {
                const crownGeometry = new THREE.ConeGeometry(1 - i * 0.2, 1.5, 8);
                const crown = new THREE.Mesh(crownGeometry, crownMaterial);
                crown.position.y = 2.5 + i * 0.7;
                crown.castShadow = true;
                tree.add(crown);
            }

            tree.position.set(x, 0, z);
            return tree;
        }

        // Schneeflocke erstellen
        function createSnowflake() {
            const geometry = new THREE.SphereGeometry(0.05, 6, 6);
            const material = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
            const snowflake = new THREE.Mesh(geometry, material);

            snowflake.position.set(
                Math.random() * 40 - 20,
                10 + Math.random() * 5,
                Math.random() * 15 - 5  // Closer to camera for sidescroller
            );

            snowflake.userData = {
                speed: 0.02 + Math.random() * 0.03,
                drift: (Math.random() - 0.5) * 0.01
            };

            return snowflake;
        }

        // Partikel erstellen
        function createParticles(position, color, count = 20) {
            const particles = [];
            for (let i = 0; i < count; i++) {
                const geometry = new THREE.SphereGeometry(0.1, 4, 4);
                const material = new THREE.MeshBasicMaterial({ color: color });
                const particle = new THREE.Mesh(geometry, material);
                particle.position.copy(position);

                particle.userData = {
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.3,
                        Math.random() * 0.3,
                        (Math.random() - 0.5) * 0.3
                    ),
                    life: 60,
                    gravity: -0.01
                };

                scene.add(particle);
                particles.push(particle);
            }
            return particles;
        }

        // Spielobjekte
        const santa = createSanta();
        scene.add(santa);

        const snowmen = [];
        const snowballs = [];
        const particles = [];
        const snowflakes = [];
        const trees = [];

        // Bäume im Hintergrund
        for (let i = 0; i < 15; i++) {
            const tree = createTree(
                Math.random() * 40 - 20,
                -10 - Math.random() * 5  // Behind the action (negative Z)
            );
            trees.push(tree);
            scene.add(tree);
        }

        // Schneeflocken
        for (let i = 0; i < 200; i++) {
            const snowflake = createSnowflake();
            snowflakes.push(snowflake);
            scene.add(snowflake);
        }

        // Spawn Timer
        let snowmanSpawnTimer = 0;
        let snowmanSpawnInterval = 120;
        let shootCooldown = 0;
        const gravity = -0.02;
        const jumpPower = 0.35;

        // Schieße Schneekugel
        function shootSnowball() {
            if (shootCooldown > 0 || !gameRunning) return;

            // Convert mouse position to 3D world position in sidescroller plane
            const vector = new THREE.Vector3(mouseX, mouseY, 0);
            vector.unproject(camera);

            // Direction from santa to mouse position (only in X-Y plane, Z stays at 0)
            const gunWorldPos = new THREE.Vector3();
            santa.userData.gun.getWorldPosition(gunWorldPos);

            const targetPos = new THREE.Vector3(vector.x, vector.y, 0);
            const dir = new THREE.Vector3()
                .subVectors(targetPos, new THREE.Vector3(santa.position.x, santa.position.y + 1.2, 0))
                .normalize();

            const snowball = createSnowball(
                new THREE.Vector3(santa.position.x + dir.x * 0.5, santa.position.y + 1.2, 0),
                dir
            );
            snowballs.push(snowball);
            scene.add(snowball);

            shootCooldown = 15;
        }

        // Spawne Schneemann
        function spawnSnowman() {
            const snowman = createSnowman();
            snowmen.push(snowman);
            scene.add(snowman);
        }

        // Update Spiel
        function update() {
            if (!gameRunning) return;

            // Update Cooldowns
            if (shootCooldown > 0) shootCooldown--;

            // Update Santa
            santa.userData.velocityY += gravity;
            santa.position.y += santa.userData.velocityY;

            // Boden Kollision
            if (santa.position.y <= 1.5) {
                santa.position.y = 1.5;
                santa.userData.velocityY = 0;
                santa.userData.isJumping = false;
            }

            // Waffe zum Mauszeiger ausrichten (in 2D sidescroller plane)
            const vector = new THREE.Vector3(mouseX, mouseY, 0);
            vector.unproject(camera);
            const dir = new THREE.Vector3()
                .subVectors(new THREE.Vector3(vector.x, vector.y, 0), santa.position)
                .normalize();

            // Calculate angle in X-Y plane (sidescroller)
            const angle = Math.atan2(dir.y, dir.x);
            santa.userData.gun.rotation.set(0, 0, angle);

            // Update Schneekugeln
            for (let i = snowballs.length - 1; i >= 0; i--) {
                const ball = snowballs[i];
                ball.position.add(ball.userData.velocity);

                // Entferne wenn außerhalb
                if (ball.position.x > 30 || ball.position.x < -30 ||
                    ball.position.z > 20 || ball.position.z < -20 ||
                    ball.position.y < -5 || ball.position.y > 20) {
                    scene.remove(ball);
                    snowballs.splice(i, 1);
                }
            }

            // Update Schneemänner
            for (let i = snowmen.length - 1; i >= 0; i--) {
                const snowman = snowmen[i];
                snowman.position.x -= snowman.userData.speed;

                // Hüpf-Animation
                snowman.userData.jumpPhase += 0.15;
                const jumpHeight = Math.abs(Math.sin(snowman.userData.jumpPhase)) * 0.4;
                snowman.position.y = snowman.userData.baseY + jumpHeight;

                // Entferne wenn zu weit links
                if (snowman.position.x < -15) {
                    scene.remove(snowman);
                    snowmen.splice(i, 1);
                    continue;
                }

                // Kollision mit Santa (2D distance in X-Y plane)
                const dx = santa.position.x - snowman.position.x;
                const dy = santa.position.y - snowman.position.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 1.5) {
                    santa.userData.health--;
                    particles.push(...createParticles(snowman.position, 0xff0000, 15));
                    scene.remove(snowman);
                    snowmen.splice(i, 1);

                    if (santa.userData.health <= 0) {
                        gameOver();
                    }
                    continue;
                }

                // Kollision mit Schneekugeln (2D distance)
                for (let j = snowballs.length - 1; j >= 0; j--) {
                    const ball = snowballs[j];
                    const bdx = ball.position.x - snowman.position.x;
                    const bdy = ball.position.y - snowman.position.y;
                    const ballDistance = Math.sqrt(bdx * bdx + bdy * bdy);

                    if (ballDistance < 0.8) {
                        particles.push(...createParticles(snowman.position, 0xffffff, 20));
                        scene.remove(snowman);
                        scene.remove(ball);
                        snowmen.splice(i, 1);
                        snowballs.splice(j, 1);
                        score += 10;
                        document.getElementById('score').textContent = score;
                        break;
                    }
                }
            }

            // Update Schneeflocken (fallen nach unten)
            snowflakes.forEach(flake => {
                flake.position.y -= flake.userData.speed;
                flake.position.x += flake.userData.drift;

                // Reset wenn zu niedrig
                if (flake.position.y < 0) {
                    flake.position.y = 15;
                    flake.position.x = Math.random() * 40 - 20;
                    flake.position.z = Math.random() * 15 - 5;
                }
            });

            // Update Partikel
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.userData.velocity.y += p.userData.gravity;
                p.position.add(p.userData.velocity);
                p.userData.life--;

                if (p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }

            // Spawne Schneemänner
            snowmanSpawnTimer++;
            if (snowmanSpawnTimer >= snowmanSpawnInterval) {
                spawnSnowman();
                snowmanSpawnTimer = 0;
                if (snowmanSpawnInterval > 60) {
                    snowmanSpawnInterval -= 1;
                }
            }
        }

        // Render Loop
        function animate() {
            requestAnimationFrame(animate);
            update();
            updateHealth();
            renderer.render(scene, camera);
        }

        // Update Health Display
        function updateHealth() {
            const healthDiv = document.getElementById('health');
            healthDiv.innerHTML = '';
            for (let i = 0; i < santa.userData.maxHealth; i++) {
                const heart = document.createElement('span');
                heart.className = 'heart';
                heart.textContent = i < santa.userData.health ? '❤️' : '🖤';
                healthDiv.appendChild(heart);
            }
        }

        // Game Over
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        // Restart Game
        function restartGame() {
            gameRunning = true;
            score = 0;
            santa.userData.health = santa.userData.maxHealth;
            santa.position.set(-10, 1.5, 0);
            santa.userData.velocityY = 0;

            // Entferne alle Objekte
            snowballs.forEach(ball => scene.remove(ball));
            snowmen.forEach(snowman => scene.remove(snowman));
            particles.forEach(p => scene.remove(p));

            snowballs.length = 0;
            snowmen.length = 0;
            particles.length = 0;
            snowmanSpawnTimer = 0;
            snowmanSpawnInterval = 120;

            document.getElementById('score').textContent = score;
            document.getElementById('gameOver').style.display = 'none';
        }

        // Event Listeners
        renderer.domElement.addEventListener('mousemove', (e) => {
            const rect = renderer.domElement.getBoundingClientRect();
            mouseX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouseY = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        });

        renderer.domElement.addEventListener('click', () => {
            if (gameRunning) {
                shootSnowball();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !santa.userData.isJumping && gameRunning) {
                e.preventDefault();
                santa.userData.velocityY = jumpPower;
                santa.userData.isJumping = true;
            }
        });

        // Mobile Controls
        const jumpButton = document.getElementById('jumpButton');
        jumpButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!santa.userData.isJumping && gameRunning) {
                santa.userData.velocityY = jumpPower;
                santa.userData.isJumping = true;
            }
        });

        renderer.domElement.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = renderer.domElement.getBoundingClientRect();
            const touch = e.touches[0];
            mouseX = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
            mouseY = -((touch.clientY - rect.top) / rect.height) * 2 + 1;

            if (gameRunning) {
                shootSnowball();
            }
        });

        renderer.domElement.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = renderer.domElement.getBoundingClientRect();
            const touch = e.touches[0];
            mouseX = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
            mouseY = -((touch.clientY - rect.top) / rect.height) * 2 + 1;
        });

        document.getElementById('restartButton').addEventListener('click', restartGame);

        // Auto-shoot für Desktop
        setInterval(() => {
            if (gameRunning && !isMobile) {
                shootSnowball();
            }
        }, 333);

        // Window Resize
        window.addEventListener('resize', () => {
            const maxWidth = Math.min(window.innerWidth - 40, 1200);
            const maxHeight = Math.min(window.innerHeight - 200, 600);
            camera.aspect = maxWidth / maxHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(maxWidth, maxHeight);
        });

        // Verstecke Instruktionen nach 5 Sekunden
        setTimeout(() => {
            document.getElementById('instructions').classList.add('hidden');
        }, 5000);

        // Start Game
        animate();
    </script>
</body>
</html>
