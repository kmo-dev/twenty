<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎅 Weihnachtsmann Shooter - Türchen 20 🎄</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #1a1a2e 0%, #0f4c75 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: white;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            cursor: crosshair;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        #health {
            position: absolute;
            top: 60px;
            left: 20px;
            font-size: 20px;
            z-index: 10;
        }

        .heart {
            display: inline-block;
            color: #ff0000;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        #jumpButton {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.3);
            border: 4px solid white;
            border-radius: 50%;
            font-size: 32px;
            color: white;
            cursor: pointer;
            display: none;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            user-select: none;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        #jumpButton:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 20;
        }

        #gameOver h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff6b6b;
        }

        #gameOver p {
            font-size: 24px;
            margin-bottom: 30px;
        }

        #restartButton {
            background: #4ecdc4;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        #restartButton:hover {
            background: #45b7af;
            transform: scale(1.05);
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            max-width: 250px;
            z-index: 10;
            transition: opacity 0.5s;
        }

        #instructions.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #instructions h3 {
            margin-bottom: 10px;
            color: #4ecdc4;
        }

        @media (max-width: 768px) {
            #jumpButton {
                display: flex !important;
            }

            canvas {
                cursor: default;
            }
        }

        .title {
            text-align: center;
            margin-bottom: 20px;
        }

        .title h1 {
            font-size: 36px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
        }

        .title p {
            font-size: 18px;
            color: #4ecdc4;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="title">
        <h1>🎅 Weihnachtsmann Shooter 🎄</h1>
        <p>Türchen 20 - pep.digital Adventskalender</p>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <div id="ui">
            Score: <span id="score">0</span>
        </div>

        <div id="health"></div>

        <div id="jumpButton">⬆</div>

        <div id="instructions">
            <h3>Steuerung:</h3>
            <p>🖱️ Maus: Zielen</p>
            <p>🖱️ Klick: Schießen</p>
            <p>⌨️ Leertaste: Springen</p>
            <p><br>Zerstöre die Schneemänner!</p>
        </div>

        <div id="gameOver">
            <h1>Game Over! 🎄</h1>
            <p>Dein Score: <span id="finalScore">0</span></p>
            <button id="restartButton">Nochmal spielen</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Canvas Größe
        function resizeCanvas() {
            const maxWidth = Math.min(window.innerWidth - 40, 1200);
            const maxHeight = Math.min(window.innerHeight - 200, 600);
            canvas.width = maxWidth;
            canvas.height = maxHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Spiel Variablen
        let gameRunning = true;
        let score = 0;
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // Weihnachtsmann
        const santa = {
            x: 100,
            y: canvas.height - 150,
            width: 50,
            height: 70,
            velocityY: 0,
            gravity: 0.8,
            jumpPower: -15,
            isJumping: false,
            health: 3,
            maxHealth: 3,
            landingSquash: 0
        };

        // Arrays für Spielobjekte
        const snowballs = [];
        const snowmen = [];
        const particles = [];
        const snowflakes = [];
        const reindeer = [];
        const gifts = [];
        const golems = [];
        const treeCannons = [];
        const flyingTrees = [];

        // Spawn Timer
        let snowmanSpawnTimer = 0;
        let snowmanSpawnInterval = 120; // Frames
        let reindeerSpawnTimer = 0;
        let reindeerSpawnInterval = 200; // Frames
        let golemSpawnTimer = 0;
        let golemSpawnInterval = 600 + Math.floor(Math.random() * 300); // 10-15 Sekunden bei 60fps
        let treeCannonSpawnTimer = 0;
        let treeCannonSpawnInterval = 900 + Math.floor(Math.random() * 300); // 15-20 Sekunden
        let shootCooldown = 0;

        // Hintergrund Elemente
        const backgroundTrees = [];
        for (let i = 0; i < 10; i++) {
            backgroundTrees.push({
                x: i * 150 + Math.random() * 50,
                y: canvas.height - 100 - Math.random() * 50,
                size: 30 + Math.random() * 20
            });
        }

        // Schneeflocken initialisieren
        for (let i = 0; i < 100; i++) {
            snowflakes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * (canvas.height - 100),
                speed: 1 + Math.random() * 2,
                size: 2 + Math.random() * 3,
                swing: Math.random() * Math.PI * 2,
                swingSpeed: 0.02 + Math.random() * 0.02
            });
        }

        // Zeichne Weihnachtsmann
        function drawSanta() {
            ctx.save();

            // Squash and Stretch basierend auf Sprunggeschwindigkeit
            let scaleX = 1;
            let scaleY = 1;

            if (santa.isJumping) {
                // Im Sprung: gestreckt (hoch) wenn nach oben, gestaucht beim Fallen
                if (santa.velocityY < -5) {
                    // Springt hoch - strecken
                    scaleY = 1.15;
                    scaleX = 0.9;
                } else if (santa.velocityY > 5) {
                    // Fällt runter - leicht strecken
                    scaleY = 1.1;
                    scaleX = 0.95;
                }
            } else if (santa.landingSquash > 0) {
                // Gerade gelandet - stauchen
                scaleY = 0.85;
                scaleX = 1.15;
                santa.landingSquash--;
            }

            // Transformation für Squash/Stretch anwenden
            ctx.translate(santa.x + santa.width / 2, santa.y + santa.height);
            ctx.scale(scaleX, scaleY);
            ctx.translate(-(santa.x + santa.width / 2), -(santa.y + santa.height));

            // Körper (rot)
            ctx.fillStyle = '#c41e3a';
            ctx.fillRect(santa.x, santa.y + 20, santa.width, santa.height - 20);

            // Gürtel (schwarz)
            ctx.fillStyle = '#000000';
            ctx.fillRect(santa.x, santa.y + 50, santa.width, 8);

            // Gürtelschnalle (gold)
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(santa.x + 17, santa.y + 48, 16, 12);

            // Kopf (hautfarben)
            ctx.fillStyle = '#ffdbac';
            ctx.beginPath();
            ctx.arc(santa.x + santa.width / 2, santa.y + 10, 18, 0, Math.PI * 2);
            ctx.fill();

            // Mütze (rot)
            ctx.fillStyle = '#c41e3a';
            ctx.beginPath();
            ctx.moveTo(santa.x + 7, santa.y + 10);
            ctx.lineTo(santa.x + santa.width - 7, santa.y + 10);
            ctx.lineTo(santa.x + santa.width - 7, santa.y - 5);
            ctx.lineTo(santa.x + 7, santa.y - 5);
            ctx.closePath();
            ctx.fill();

            // Mützen Bommel (weiß)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(santa.x + santa.width / 2, santa.y - 10, 6, 0, Math.PI * 2);
            ctx.fill();

            // Bart (weiß)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(santa.x + santa.width / 2, santa.y + 20, 12, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // Waffe (Schneekanone) - separat ohne Squash/Stretch
            ctx.save();
            const angle = Math.atan2(mouseY - (santa.y + 30), mouseX - (santa.x + santa.width));
            ctx.translate(santa.x + santa.width, santa.y + 30);
            ctx.rotate(angle);

            // Kanone
            ctx.fillStyle = '#4a5568';
            ctx.fillRect(0, -5, 40, 10);
            ctx.fillStyle = '#2d3748';
            ctx.fillRect(35, -8, 10, 16);

            ctx.restore();
        }

        // Zeichne Schneemann (mit Hüpfen)
        function drawSnowman(snowman) {
            const drawY = snowman.y + snowman.jumpOffset;

            ctx.save();

            // Squash and Stretch basierend auf Hüpf-Phase
            let scaleX = 1;
            let scaleY = 1;

            // Sin-Wert für Hüpf-Phase: 0 = oben, PI = unten
            const sinValue = Math.sin(snowman.jumpPhase);

            if (sinValue < -0.5) {
                // Oben in der Luft - strecken
                scaleY = 1.2;
                scaleX = 0.85;
            } else if (sinValue > 0.8) {
                // Ganz unten - stauchen
                scaleY = 0.8;
                scaleX = 1.25;
            } else if (sinValue > 0) {
                // Fallend - leicht strecken
                scaleY = 1.1;
                scaleX = 0.92;
            }

            // Transformation für Squash/Stretch anwenden (vom Boden aus)
            ctx.translate(snowman.x, drawY + 40);
            ctx.scale(scaleX, scaleY);
            ctx.translate(-snowman.x, -(drawY + 40));

            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;

            // Unterer Kreis
            ctx.beginPath();
            ctx.arc(snowman.x, drawY + 20, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Mittlerer Kreis
            ctx.beginPath();
            ctx.arc(snowman.x, drawY, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Kopf
            ctx.beginPath();
            ctx.arc(snowman.x, drawY - 15, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Augen
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(snowman.x - 4, drawY - 17, 2, 0, Math.PI * 2);
            ctx.arc(snowman.x + 4, drawY - 17, 2, 0, Math.PI * 2);
            ctx.fill();

            // Nase (Karotte)
            ctx.fillStyle = '#ff6b35';
            ctx.beginPath();
            ctx.moveTo(snowman.x, drawY - 13);
            ctx.lineTo(snowman.x + 10, drawY - 13);
            ctx.lineTo(snowman.x, drawY - 11);
            ctx.closePath();
            ctx.fill();

            // Knöpfe
            ctx.fillStyle = '#000000';
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.arc(snowman.x, drawY - 5 + i * 7, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // Zeichne Schneekugel
        function drawSnowball(snowball) {
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(snowball.x, snowball.y, snowball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Glitzer Effekt
            ctx.fillStyle = 'rgba(173, 216, 230, 0.5)';
            ctx.beginPath();
            ctx.arc(snowball.x - 2, snowball.y - 2, snowball.radius / 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // Zeichne Baum
        function drawTree(tree) {
            ctx.fillStyle = '#228b22';
            ctx.beginPath();
            ctx.moveTo(tree.x, tree.y);
            ctx.lineTo(tree.x - tree.size / 2, tree.y + tree.size);
            ctx.lineTo(tree.x + tree.size / 2, tree.y + tree.size);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#654321';
            ctx.fillRect(tree.x - 5, tree.y + tree.size, 10, 20);
        }

        // Erstelle Partikel
        function createParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 60,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        // Schieße Schneekugel
        function shootSnowball() {
            if (shootCooldown > 0 || !gameRunning) return;

            const angle = Math.atan2(mouseY - (santa.y + 30), mouseX - (santa.x + santa.width));
            const speed = 12;

            snowballs.push({
                x: santa.x + santa.width + 40 * Math.cos(angle),
                y: santa.y + 30 + 40 * Math.sin(angle),
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: 8
            });

            shootCooldown = 15; // Cooldown frames
        }

        // Spawne Schneemann
        function spawnSnowman() {
            snowmen.push({
                x: canvas.width + 50,
                y: canvas.height - 120,  // Auf Bodenhöhe
                width: 40,
                height: 50,
                speed: 2 + Math.random() * 1.5,
                health: 1,
                jumpPhase: Math.random() * Math.PI * 2,
                jumpOffset: 0
            });
        }

        // Zeichne Golem
        function drawGolem(golem) {
            const drawY = golem.y;

            ctx.save();

            // Squash and Stretch basierend auf Walking-Phase
            let scaleX = 1;
            let scaleY = 1;

            const walkValue = Math.sin(golem.walkPhase);
            if (Math.abs(walkValue) > 0.7) {
                // Beim Auftreten - stauchen
                scaleY = 0.95;
                scaleX = 1.05;
            }

            // Transformation für Squash/Stretch anwenden
            ctx.translate(golem.x, drawY + 70);
            ctx.scale(scaleX, scaleY);
            ctx.translate(-golem.x, -(drawY + 70));

            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;

            // Beine als Schneekugeln (einfache Hüpf-Animation)
            // Zwei Füße an festen Positionen, einer hüpft über den anderen
            const hopPhase = Math.sin(golem.walkPhase);

            // Linkes Bein (Kugel) - hüpft wenn Phase positiv
            const leftLegY = drawY + 75 - (hopPhase > 0 ? hopPhase * 15 : 0);
            const leftLegX = golem.x - 15;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(leftLegX, leftLegY, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Rechtes Bein (Kugel) - hüpft wenn Phase negativ
            const rightLegY = drawY + 75 - (hopPhase < 0 ? -hopPhase * 15 : 0);
            const rightLegX = golem.x + 15;
            ctx.beginPath();
            ctx.arc(rightLegX, rightLegY, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Unterer Körper (größer)
            ctx.beginPath();
            ctx.arc(golem.x, drawY + 40, 35, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Mittlerer Körper
            ctx.beginPath();
            ctx.arc(golem.x, drawY + 5, 28, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Kopf (groß)
            ctx.beginPath();
            ctx.arc(golem.x, drawY - 30, 22, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Böse Augenbrauen
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 4;
            ctx.beginPath();
            // Linke Augenbraue (schräg nach unten)
            ctx.moveTo(golem.x - 16, drawY - 36);
            ctx.lineTo(golem.x - 4, drawY - 32);
            // Rechte Augenbraue (schräg nach unten)
            ctx.moveTo(golem.x + 4, drawY - 32);
            ctx.lineTo(golem.x + 16, drawY - 36);
            ctx.stroke();

            // Augen (böse rot glühend)
            ctx.fillStyle = '#ff0000';
            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(golem.x - 8, drawY - 30, 5, 0, Math.PI * 2);
            ctx.arc(golem.x + 8, drawY - 30, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Pupillen (klein und böse)
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(golem.x - 8, drawY - 30, 2, 0, Math.PI * 2);
            ctx.arc(golem.x + 8, drawY - 30, 2, 0, Math.PI * 2);
            ctx.fill();

            // Mund (zackig und böse)
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(golem.x - 12, drawY - 18);
            ctx.lineTo(golem.x - 8, drawY - 22);
            ctx.lineTo(golem.x - 4, drawY - 18);
            ctx.lineTo(golem.x, drawY - 22);
            ctx.lineTo(golem.x + 4, drawY - 18);
            ctx.lineTo(golem.x + 8, drawY - 22);
            ctx.lineTo(golem.x + 12, drawY - 18);
            ctx.stroke();

            // Zähne (spitz)
            ctx.fillStyle = '#ffffff';
            for (let i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.moveTo(golem.x + i * 6 - 2, drawY - 18);
                ctx.lineTo(golem.x + i * 6, drawY - 14);
                ctx.lineTo(golem.x + i * 6 + 2, drawY - 18);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            // Arme (dick)
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;

            // Linker Arm
            ctx.beginPath();
            ctx.arc(golem.x - 38, drawY + 10, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Rechter Arm
            ctx.beginPath();
            ctx.arc(golem.x + 38, drawY + 10, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Knöpfe (schwarz, größer)
            ctx.fillStyle = '#000000';
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.arc(golem.x, drawY - 5 + i * 12, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // Health Bar über dem Kopf
            const barWidth = 60;
            const barHeight = 6;
            const healthPercent = golem.health / golem.maxHealth;

            // Hintergrund (rot)
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(golem.x - barWidth / 2, drawY - 60, barWidth, barHeight);

            // Gesundheit (grün)
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(golem.x - barWidth / 2, drawY - 60, barWidth * healthPercent, barHeight);

            // Rahmen
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.strokeRect(golem.x - barWidth / 2, drawY - 60, barWidth, barHeight);

            ctx.restore();
        }

        // Spawne Golem
        function spawnGolem() {
            golems.push({
                x: canvas.width + 100,
                y: canvas.height - 140,  // Näher am Boden
                width: 80,
                height: 110,
                speed: 1 + Math.random() * 0.5,  // Langsamer als Schneemänner
                health: 5,
                maxHealth: 5,
                walkPhase: Math.random() * Math.PI * 2
            });
        }

        // Erstelle Nadel-Konfetti (grün/braun)
        function createNeedleConfetti(x, y, count = 40) {
            const colors = ['#228b22', '#2d5016', '#654321', '#3d5c29'];
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10 - 2,
                    life: 60,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 8 + 2,
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.3,
                    isNeedle: true
                });
            }
        }

        // Zeichne Baum-Kanone mit Rentier
        function drawTreeCannon(cannon) {
            ctx.save();

            // Rückstoß-Offset
            const recoilX = cannon.recoilOffset || 0;

            // Rentier vorne (zieht die Kanone) - mehr Abstand
            const deerX = cannon.x - 160 + recoilX;
            const deerY = cannon.y + 40;

            // Rentier Körper (braun) - größer
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(deerX, deerY, 60, 30);

            // Kopf
            ctx.fillRect(deerX - 25, deerY + 8, 30, 24);

            // Geweih (größer)
            ctx.strokeStyle = '#654321';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(deerX - 12, deerY + 8);
            ctx.lineTo(deerX - 18, deerY - 18);
            ctx.moveTo(deerX - 6, deerY + 8);
            ctx.lineTo(deerX - 12, deerY - 12);
            ctx.moveTo(deerX + 6, deerY + 8);
            ctx.lineTo(deerX, deerY - 12);
            ctx.stroke();

            // Nase (rot - Rudolph!)
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(deerX - 25, deerY + 20, 5, 0, Math.PI * 2);
            ctx.fill();

            // Beine
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(deerX + 8, deerY + 30, 7, 18);
            ctx.fillRect(deerX + 38, deerY + 30, 7, 18);

            // Seil zur Kanone
            ctx.strokeStyle = '#654321';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(deerX + 60, deerY + 15);
            ctx.lineTo(cannon.x - 60 + recoilX, cannon.y + 55);
            ctx.stroke();

            // Kanone (größer und rotiert)
            const cannonX = cannon.x + recoilX;
            const cannonAngle = -Math.PI / 6; // -30 Grad (nach links oben)

            // Kanonen-Basis (Holz) - größer
            ctx.fillStyle = '#654321';
            ctx.fillRect(cannonX - 50, cannon.y + 40, 120, 40);

            // Räder (größer)
            ctx.fillStyle = '#2d1810';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(cannonX - 30, cannon.y + 80, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(cannonX + 50, cannon.y + 80, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Kanonen-Rohr (rotiert, größer)
            ctx.save();
            ctx.translate(cannonX + 10, cannon.y + 50);
            ctx.rotate(cannonAngle);

            // Rohr (länger und dicker)
            ctx.fillStyle = '#2d3748';
            ctx.fillRect(-10, -15, 100, 30);

            // Kanonenmündung
            ctx.fillStyle = '#1a202c';
            ctx.fillRect(90, -20, 15, 40);

            // Verzierung (Metallringe)
            ctx.strokeStyle = '#4a5568';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(25, 0, 18, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(60, 0, 18, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();

            // Health Bar über der Kanone
            const barWidth = 100;
            const barHeight = 8;
            const healthPercent = cannon.health / cannon.maxHealth;

            // Hintergrund (rot)
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(cannon.x - barWidth / 2, cannon.y, barWidth, barHeight);

            // Gesundheit (grün)
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(cannon.x - barWidth / 2, cannon.y, barWidth * healthPercent, barHeight);

            // Rahmen
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.strokeRect(cannon.x - barWidth / 2, cannon.y, barWidth, barHeight);

            ctx.restore();
        }

        // Spawne Baum-Kanone
        function spawnTreeCannon() {
            treeCannons.push({
                x: canvas.width + 200,
                y: canvas.height - 180,
                width: 200,
                height: 100,
                speed: 0.5,
                health: 10,
                maxHealth: 10,
                shootTimer: 120 + Math.floor(Math.random() * 60),
                recoilOffset: 0
            });
        }

        // Zeichne fliegenden Tannenbaum
        function drawFlyingTree(tree) {
            ctx.save();

            // Rotation für Flug-Effekt
            ctx.translate(tree.x, tree.y);
            ctx.rotate(tree.rotation);

            // Baumstamm
            ctx.fillStyle = '#654321';
            ctx.fillRect(-5, 0, 10, 25);

            // Baum (grün, Dreieck)
            ctx.fillStyle = '#228b22';
            ctx.strokeStyle = '#1a5c1a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -35);
            ctx.lineTo(-15, 0);
            ctx.lineTo(15, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Zweiter Abschnitt
            ctx.beginPath();
            ctx.moveTo(0, -25);
            ctx.lineTo(-12, -5);
            ctx.lineTo(12, -5);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        }

        // Zeichne Rentier
        function drawReindeer(deer) {
            ctx.save();

            // Körper (braun)
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(deer.x, deer.y, 40, 20);

            // Kopf
            ctx.fillRect(deer.x - 15, deer.y + 5, 20, 15);

            // Geweih
            ctx.strokeStyle = '#654321';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(deer.x - 10, deer.y + 5);
            ctx.lineTo(deer.x - 15, deer.y - 10);
            ctx.moveTo(deer.x - 5, deer.y + 5);
            ctx.lineTo(deer.x - 10, deer.y - 8);
            ctx.stroke();

            // Nase (rot)
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(deer.x - 15, deer.y + 12, 3, 0, Math.PI * 2);
            ctx.fill();

            // Beine
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(deer.x + 5, deer.y + 20, 5, 10);
            ctx.fillRect(deer.x + 20, deer.y + 20, 5, 10);

            // Schlitten
            ctx.fillStyle = '#c41e3a';
            ctx.fillRect(deer.x + 50, deer.y + 5, 30, 20);
            ctx.fillStyle = '#654321';
            ctx.beginPath();
            ctx.arc(deer.x + 55, deer.y + 25, 5, 0, Math.PI * 2);
            ctx.arc(deer.x + 75, deer.y + 25, 5, 0, Math.PI * 2);
            ctx.fill();

            // Geschenk im Schlitten
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(deer.x + 58, deer.y + 10, 15, 12);
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(deer.x + 58, deer.y + 16);
            ctx.lineTo(deer.x + 73, deer.y + 16);
            ctx.moveTo(deer.x + 65.5, deer.y + 10);
            ctx.lineTo(deer.x + 65.5, deer.y + 22);
            ctx.stroke();

            ctx.restore();
        }

        // Zeichne Geschenk
        function drawGift(gift) {
            ctx.save();

            // Geschenk Box
            ctx.fillStyle = gift.color;
            ctx.fillRect(gift.x - 10, gift.y - 10, 20, 20);

            // Schleife
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(gift.x - 10, gift.y);
            ctx.lineTo(gift.x + 10, gift.y);
            ctx.moveTo(gift.x, gift.y - 10);
            ctx.lineTo(gift.x, gift.y + 10);
            ctx.stroke();

            // Schleife oben
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(gift.x - 5, gift.y - 12, 4, 0, Math.PI * 2);
            ctx.arc(gift.x + 5, gift.y - 12, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // Spawne Rentier
        function spawnReindeer() {
            reindeer.push({
                x: canvas.width + 100,
                y: 50 + Math.random() * 100,
                speed: 1 + Math.random() * 0.5,
                dropTimer: 60 + Math.floor(Math.random() * 60)
            });
        }

        // Erstelle Konfetti
        function createConfetti(x, y, count = 30) {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffa500', '#ff69b4'];
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8 - 2,
                    life: 60,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 5 + 2,
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.2
                });
            }
        }

        // Update Spiel
        function update() {
            if (!gameRunning) return;

            // Update Cooldowns
            if (shootCooldown > 0) shootCooldown--;

            // Update Santa
            santa.velocityY += santa.gravity;
            santa.y += santa.velocityY;

            // Boden Kollision
            const ground = canvas.height - 150;
            if (santa.y >= ground) {
                if (santa.isJumping) {
                    // Gerade gelandet - Squash-Effekt triggern
                    santa.landingSquash = 5;
                }
                santa.y = ground;
                santa.velocityY = 0;
                santa.isJumping = false;
            }

            // Update Schneekugeln
            for (let i = snowballs.length - 1; i >= 0; i--) {
                const ball = snowballs[i];
                ball.x += ball.vx;
                ball.y += ball.vy;

                // Entferne wenn außerhalb
                if (ball.x > canvas.width + 50 || ball.x < -50 || ball.y > canvas.height + 50 || ball.y < -50) {
                    snowballs.splice(i, 1);
                }
            }

            // Update Schneemänner
            for (let i = snowmen.length - 1; i >= 0; i--) {
                const snowman = snowmen[i];
                snowman.x -= snowman.speed;

                // Hüpf-Animation
                snowman.jumpPhase += 0.1;
                snowman.jumpOffset = -Math.abs(Math.sin(snowman.jumpPhase)) * 15;

                // Entferne wenn zu weit links
                if (snowman.x < -100) {
                    snowmen.splice(i, 1);
                    continue;
                }

                // Kollision mit Santa
                if (snowman.x < santa.x + santa.width &&
                    snowman.x + snowman.width > santa.x &&
                    snowman.y + snowman.jumpOffset < santa.y + santa.height &&
                    snowman.y + snowman.jumpOffset + snowman.height > santa.y) {
                    santa.health--;
                    createParticles(snowman.x, snowman.y, '#ff0000', 15);
                    snowmen.splice(i, 1);

                    if (santa.health <= 0) {
                        gameOver();
                    }
                    continue;
                }

                // Kollision mit Schneekugeln
                for (let j = snowballs.length - 1; j >= 0; j--) {
                    const ball = snowballs[j];
                    const dx = ball.x - snowman.x;
                    const dy = ball.y - (snowman.y + snowman.jumpOffset);
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < ball.radius + 25) {
                        createParticles(snowman.x, snowman.y + snowman.jumpOffset, '#ffffff', 20);
                        snowmen.splice(i, 1);
                        snowballs.splice(j, 1);
                        score += 10;
                        document.getElementById('score').textContent = score;
                        break;
                    }
                }
            }

            // Update Golems
            for (let i = golems.length - 1; i >= 0; i--) {
                const golem = golems[i];
                golem.x -= golem.speed;

                // Walking Animation
                golem.walkPhase += 0.08;

                // Entferne wenn zu weit links
                if (golem.x < -150) {
                    golems.splice(i, 1);
                    continue;
                }

                // Kollision mit Santa
                if (golem.x < santa.x + santa.width &&
                    golem.x + golem.width > santa.x &&
                    golem.y < santa.y + santa.height &&
                    golem.y + golem.height > santa.y) {
                    santa.health--;
                    createParticles(golem.x, golem.y + 50, '#ff0000', 20);
                    // Golem wird nicht zerstört bei Kollision - zu stark!

                    if (santa.health <= 0) {
                        gameOver();
                    }
                }

                // Kollision mit Schneekugeln
                for (let j = snowballs.length - 1; j >= 0; j--) {
                    const ball = snowballs[j];
                    const dx = ball.x - golem.x;
                    const dy = ball.y - (golem.y + 40);
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < ball.radius + 40) {
                        golem.health--;
                        createParticles(ball.x, ball.y, '#ffffff', 15);
                        snowballs.splice(j, 1);

                        if (golem.health <= 0) {
                            // Golem besiegt - große Explosion!
                            createParticles(golem.x, golem.y + 50, '#ffffff', 40);
                            createConfetti(golem.x, golem.y + 50, 50);
                            golems.splice(i, 1);
                            score += 50;
                            document.getElementById('score').textContent = score;
                        }
                        break;
                    }
                }
            }

            // Update Baum-Kanonen
            for (let i = treeCannons.length - 1; i >= 0; i--) {
                const cannon = treeCannons[i];
                cannon.x -= cannon.speed;

                // Rückstoß-Animation
                if (cannon.recoilOffset > 0) {
                    cannon.recoilOffset -= 2;
                    if (cannon.recoilOffset < 0) cannon.recoilOffset = 0;
                }

                // Schießen
                cannon.shootTimer--;
                if (cannon.shootTimer <= 0 && cannon.x > 0 && cannon.x < canvas.width - 100) {
                    // Berechne Mündungsposition (Kanone ist -30° rotiert)
                    const cannonAngle = -Math.PI / 6; // -30 Grad
                    const barrelLength = 100;
                    const muzzleX = cannon.x + 10 + barrelLength * Math.cos(cannonAngle);
                    const muzzleY = cannon.y + 50 + barrelLength * Math.sin(cannonAngle);

                    // Tannenbaum schießen (in Richtung der Kanone: nach links oben)
                    const speed = 10;
                    flyingTrees.push({
                        x: muzzleX,
                        y: muzzleY,
                        vx: -speed * Math.cos(Math.PI / 6),  // nach links: ca. -8.66
                        vy: -speed * Math.sin(Math.PI / 6),  // nach oben: ca. -5
                        rotation: Math.PI / 4,  // Anfangsrotation
                        rotationSpeed: 0.15
                    });

                    // Rückstoß!
                    cannon.recoilOffset = 20;

                    // Nadel-Konfetti beim Schuss aus der Mündung!
                    createNeedleConfetti(muzzleX, muzzleY, 25);

                    cannon.shootTimer = 90 + Math.floor(Math.random() * 60);
                }

                // Entferne wenn zu weit links
                if (cannon.x < -250) {
                    treeCannons.splice(i, 1);
                    continue;
                }

                // Kollision mit Santa
                if (cannon.x < santa.x + santa.width + 70 &&
                    cannon.x + cannon.width > santa.x &&
                    cannon.y < santa.y + santa.height &&
                    cannon.y + cannon.height > santa.y) {
                    santa.health--;
                    createNeedleConfetti(cannon.x, cannon.y + 60, 30);
                    // Kanone wird nicht zerstört bei Kollision

                    if (santa.health <= 0) {
                        gameOver();
                    }
                }

                // Kollision mit Schneekugeln
                for (let j = snowballs.length - 1; j >= 0; j--) {
                    const ball = snowballs[j];
                    const dx = ball.x - cannon.x;
                    const dy = ball.y - (cannon.y + 60);
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < ball.radius + 60) {
                        cannon.health--;
                        createParticles(ball.x, ball.y, '#ffffff', 15);
                        snowballs.splice(j, 1);

                        if (cannon.health <= 0) {
                            // Kanone zerstört - große Nadel-Explosion!
                            createNeedleConfetti(cannon.x, cannon.y + 60, 60);
                            createParticles(cannon.x, cannon.y + 60, '#654321', 30);
                            treeCannons.splice(i, 1);
                            score += 100;
                            document.getElementById('score').textContent = score;
                        }
                        break;
                    }
                }
            }

            // Update fliegende Tannenbäume
            for (let i = flyingTrees.length - 1; i >= 0; i--) {
                const tree = flyingTrees[i];
                tree.x += tree.vx;
                tree.y += tree.vy;
                tree.rotation += tree.rotationSpeed;

                // Gravität
                tree.vy += 0.1;

                // Entferne wenn außerhalb
                if (tree.x < -50 || tree.y > canvas.height + 50) {
                    flyingTrees.splice(i, 1);
                    continue;
                }

                // Kollision mit Santa
                if (tree.x > santa.x && tree.x < santa.x + santa.width &&
                    tree.y > santa.y && tree.y < santa.y + santa.height) {
                    santa.health--;
                    createNeedleConfetti(tree.x, tree.y, 30);
                    flyingTrees.splice(i, 1);

                    if (santa.health <= 0) {
                        gameOver();
                    }
                    continue;
                }

                // Kollision mit Schneekugeln
                for (let j = snowballs.length - 1; j >= 0; j--) {
                    const ball = snowballs[j];
                    const dx = ball.x - tree.x;
                    const dy = ball.y - tree.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < ball.radius + 20) {
                        // Tannenbaum explodiert mit grünem Nadel-Konfetti!
                        createNeedleConfetti(tree.x, tree.y, 35);
                        flyingTrees.splice(i, 1);
                        snowballs.splice(j, 1);
                        score += 15;
                        document.getElementById('score').textContent = score;
                        break;
                    }
                }
            }

            // Update Rentiere
            for (let i = reindeer.length - 1; i >= 0; i--) {
                const deer = reindeer[i];
                deer.x -= deer.speed;

                // Leichte Auf-und-Ab-Bewegung
                deer.y += Math.sin(Date.now() / 200 + i) * 0.5;

                // Geschenk abwerfen
                deer.dropTimer--;
                if (deer.dropTimer <= 0 && deer.x > 0 && deer.x < canvas.width - 100) {
                    const colors = ['#ffd700', '#ff69b4', '#00ffff', '#00ff00'];
                    gifts.push({
                        x: deer.x + 65,
                        y: deer.y + 20,
                        vy: 0,
                        gravity: 0.3,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        rotation: 0
                    });
                    deer.dropTimer = 80 + Math.floor(Math.random() * 60);
                }

                // Entferne wenn zu weit links
                if (deer.x < -150) {
                    reindeer.splice(i, 1);
                    continue;
                }

                // Kollision mit Schneekugeln
                for (let j = snowballs.length - 1; j >= 0; j--) {
                    const ball = snowballs[j];
                    const dx = ball.x - deer.x;
                    const dy = ball.y - deer.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < ball.radius + 30) {
                        createParticles(deer.x, deer.y, '#8B4513', 20);
                        reindeer.splice(i, 1);
                        snowballs.splice(j, 1);
                        score += 20;
                        document.getElementById('score').textContent = score;
                        break;
                    }
                }
            }

            // Update Geschenke
            for (let i = gifts.length - 1; i >= 0; i--) {
                const gift = gifts[i];
                gift.vy += gift.gravity;
                gift.y += gift.vy;
                gift.rotation += 0.1;

                // Entferne wenn zu weit unten
                if (gift.y > canvas.height + 50) {
                    gifts.splice(i, 1);
                    continue;
                }

                // Kollision mit Boden - Konfetti!
                if (gift.y >= canvas.height - 100) {
                    createConfetti(gift.x, gift.y, 30);
                    gifts.splice(i, 1);
                    continue;
                }

                // Kollision mit Santa
                if (gift.x > santa.x && gift.x < santa.x + santa.width &&
                    gift.y > santa.y && gift.y < santa.y + santa.height) {
                    santa.health--;
                    createConfetti(gift.x, gift.y, 30);
                    gifts.splice(i, 1);

                    if (santa.health <= 0) {
                        gameOver();
                    }
                    continue;
                }

                // Kollision mit Schneekugeln - auch Konfetti!
                for (let j = snowballs.length - 1; j >= 0; j--) {
                    const ball = snowballs[j];
                    const dx = ball.x - gift.x;
                    const dy = ball.y - gift.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < ball.radius + 15) {
                        createConfetti(gift.x, gift.y, 25);
                        gifts.splice(i, 1);
                        snowballs.splice(j, 1);
                        score += 5;
                        document.getElementById('score').textContent = score;
                        break;
                    }
                }
            }

            // Update Schneeflocken (fallen gerade nach unten)
            snowflakes.forEach(flake => {
                flake.y += flake.speed;
                flake.swing += flake.swingSpeed;

                // Reset wenn am Boden
                if (flake.y > canvas.height - 100) {
                    flake.y = -10;
                    flake.x = Math.random() * canvas.width;
                }
            });

            // Update Partikel
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1; // Gravität für Konfetti
                if (p.rotation !== undefined) {
                    p.rotation += p.rotationSpeed;
                }
                p.life--;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Spawne Schneemänner
            snowmanSpawnTimer++;
            if (snowmanSpawnTimer >= snowmanSpawnInterval) {
                spawnSnowman();
                snowmanSpawnTimer = 0;
                // Erhöhe Schwierigkeit
                if (snowmanSpawnInterval > 60) {
                    snowmanSpawnInterval -= 1;
                }
            }

            // Spawne Rentiere
            reindeerSpawnTimer++;
            if (reindeerSpawnTimer >= reindeerSpawnInterval) {
                spawnReindeer();
                reindeerSpawnTimer = 0;
                // Erhöhe Schwierigkeit
                if (reindeerSpawnInterval > 150) {
                    reindeerSpawnInterval -= 1;
                }
            }

            // Spawne Golems (alle 10-15 Sekunden)
            golemSpawnTimer++;
            if (golemSpawnTimer >= golemSpawnInterval) {
                spawnGolem();
                golemSpawnTimer = 0;
                // Zufälliges nächstes Intervall
                golemSpawnInterval = 600 + Math.floor(Math.random() * 300);
            }

            // Spawne Baum-Kanonen (alle 15-20 Sekunden)
            treeCannonSpawnTimer++;
            if (treeCannonSpawnTimer >= treeCannonSpawnInterval) {
                spawnTreeCannon();
                treeCannonSpawnTimer = 0;
                // Zufälliges nächstes Intervall
                treeCannonSpawnInterval = 900 + Math.floor(Math.random() * 300);
            }
        }

        // Zeichne alles
        function draw() {
            // Himmel (Gradient bereits im CSS)
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Bäume im Hintergrund
            backgroundTrees.forEach(tree => {
                tree.x -= 0.5;
                if (tree.x < -50) {
                    tree.x = canvas.width + 50;
                }
                drawTree(tree);
            });

            // Boden
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);

            // Schneeflocken (fallen gerade runter)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            snowflakes.forEach(flake => {
                ctx.beginPath();
                ctx.arc(flake.x, flake.y, flake.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Rentiere (im Hintergrund)
            reindeer.forEach(drawReindeer);

            // Geschenke
            gifts.forEach(gift => {
                ctx.save();
                ctx.translate(gift.x, gift.y);
                ctx.rotate(gift.rotation);
                ctx.translate(-gift.x, -gift.y);
                drawGift(gift);
                ctx.restore();
            });

            // Partikel / Konfetti
            particles.forEach(p => {
                ctx.save();
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 60;

                if (p.rotation !== undefined) {
                    // Konfetti mit Rotation
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation);
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                } else {
                    // Normale Partikel (rund)
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.globalAlpha = 1;
                ctx.restore();
            });

            // Schneemänner
            snowmen.forEach(drawSnowman);

            // Golems (größer, darüber)
            golems.forEach(drawGolem);

            // Baum-Kanonen (Boss-Gegner)
            treeCannons.forEach(drawTreeCannon);

            // Fliegende Tannenbäume
            flyingTrees.forEach(drawFlyingTree);

            // Schneekugeln
            snowballs.forEach(drawSnowball);

            // Santa
            drawSanta();

            // Ziellinie
            if (!isMobile) {
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(santa.x + santa.width, santa.y + 30);
                ctx.lineTo(mouseX, mouseY);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        // Game Loop
        function gameLoop() {
            update();
            draw();
            updateHealth();
            requestAnimationFrame(gameLoop);
        }

        // Update Health Display
        function updateHealth() {
            const healthDiv = document.getElementById('health');
            healthDiv.innerHTML = '';
            for (let i = 0; i < santa.maxHealth; i++) {
                const heart = document.createElement('span');
                heart.className = 'heart';
                heart.textContent = i < santa.health ? '❤️' : '🖤';
                healthDiv.appendChild(heart);
            }
        }

        // Game Over
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        // Restart Game
        function restartGame() {
            gameRunning = true;
            score = 0;
            santa.health = santa.maxHealth;
            santa.y = canvas.height - 150;
            santa.velocityY = 0;
            santa.isJumping = false;
            santa.landingSquash = 0;
            snowballs.length = 0;
            snowmen.length = 0;
            particles.length = 0;
            reindeer.length = 0;
            gifts.length = 0;
            golems.length = 0;
            treeCannons.length = 0;
            flyingTrees.length = 0;
            snowmanSpawnTimer = 0;
            snowmanSpawnInterval = 120;
            reindeerSpawnTimer = 0;
            reindeerSpawnInterval = 200;
            golemSpawnTimer = 0;
            golemSpawnInterval = 600 + Math.floor(Math.random() * 300);
            treeCannonSpawnTimer = 0;
            treeCannonSpawnInterval = 900 + Math.floor(Math.random() * 300);
            document.getElementById('score').textContent = score;
            document.getElementById('gameOver').style.display = 'none';
        }

        // Event Listeners
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        canvas.addEventListener('click', () => {
            if (gameRunning) {
                shootSnowball();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !santa.isJumping && gameRunning) {
                e.preventDefault();
                santa.velocityY = santa.jumpPower;
                santa.isJumping = true;
            }
        });

        // Mobile Controls
        const jumpButton = document.getElementById('jumpButton');
        jumpButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!santa.isJumping && gameRunning) {
                santa.velocityY = santa.jumpPower;
                santa.isJumping = true;
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            mouseX = touch.clientX - rect.left;
            mouseY = touch.clientY - rect.top;

            if (gameRunning) {
                shootSnowball();
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            mouseX = touch.clientX - rect.left;
            mouseY = touch.clientY - rect.top;
        });

        document.getElementById('restartButton').addEventListener('click', restartGame);

        // Auto-shoot für Desktop (alle 20 Frames)
        setInterval(() => {
            if (gameRunning && !isMobile) {
                shootSnowball();
            }
        }, 333); // ~3 Schüsse pro Sekunde

        // Verstecke Instruktionen nach 5 Sekunden
        setTimeout(() => {
            document.getElementById('instructions').classList.add('hidden');
        }, 5000);

        // Start Game
        gameLoop();
    </script>
</body>
</html>
